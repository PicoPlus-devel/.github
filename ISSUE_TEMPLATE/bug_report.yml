name: Bug report
description: Report a bug, glitch, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!

        **⚠️ Please do NOT attach ROMs.** This is a public repository, so shared ROM files are a copyright problem and will be removed. Screen recordings, photos, logs, and config files are welcome and very helpful for debugging. For anything else, please use the other channels linked from https://github.com/PicoPlus-devel

  - type: checkboxes
    id: no-roms
    attributes:
      label: Confirmation
      options:
        - label: I confirm this issue does not include any ROM files.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem.
      placeholder: The Addams Family shows graphical glitches during gameplay...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Load game '...'
        2. Go to '...'
        3. See glitch
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: input
    id: game
    attributes:
      label: Affected game(s)
      description: Which game(s) show the problem? (Do not attach the ROM.)
      placeholder: The Addams Family
    validations:
      required: false

  - type: dropdown
    id: board
    attributes:
      label: Hardware configuration (HW_CONFIG)
      description: The HW_CONFIG value you built with (see pico_shared/BoardConfigs.cmake).
      options:
        - "1: Pimoroni Pico DV Demo Base"
        - "2: Breadboard with Adafruit DVI + MicroSD breakout (custom PCB)"
        - "3: Adafruit Feather RP2040 DVI"
        - "4: Waveshare RP2040-PiZero"
        - "5: Adafruit Metro RP2350"
        - "6: Waveshare RP2040-Zero / RP2350-Zero with custom PCB"
        - "7: WaveShare RP2350-PiZero"
        - "8: Adafruit Fruit Jam"
        - "9: WaveShare RP2350-USBA"
        - "10: Spotpear HDMI board"
        - "11: RP2350-USB-A (deprecated, do not use)"
        - "12: Murmulator M1"
        - "13: Murmulator M2 (RP2350 only)"
        - "14: Adafruit Feather RP2350 with TLV320DAC3100 I2S DAC + SD breakout"
        - "Other / custom"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firmware version / release
      description: Which release or commit are you running?
      placeholder: e.g. v1.0.0 or commit hash
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Attach a screen recording or photo of the glitch if possible. (No ROMs.)
    validations:
      required: false
